name: Generate XHS Video

on:
  repository_dispatch:
    types: [generate-video]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get install -y -q --no-install-recommends ffmpeg fonts-noto-cjk

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run video pipeline
        env:
          DATABASE_URL:       ${{ secrets.DATABASE_URL }}
          SECRET_KEY:         ${{ secrets.SECRET_KEY }}
          R2_ENDPOINT:        ${{ secrets.R2_ENDPOINT }}
          S3_KEY:             ${{ secrets.S3_KEY }}
          S3_SECRET:          ${{ secrets.S3_SECRET }}
          S3_BUCKET:          ${{ secrets.S3_BUCKET }}
          R2_PUBLIC_URL:      ${{ secrets.R2_PUBLIC_URL }}
          DEEPSEEK_API_KEY:   ${{ secrets.DEEPSEEK_API_KEY }}
          MINIMAX_API_KEY:    ${{ secrets.MINIMAX_API_KEY }}
          RESEND_API_KEY:     ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/run_video_job.py "${{ github.event.client_payload.job_id }}"
